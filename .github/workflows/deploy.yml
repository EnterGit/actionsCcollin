name: Deploy

on: push

jobs:
  first_job:
    runs-on: ubuntu-latest

    steps:
      - name: print variable
        run: echo "${{ secrets.TOCKE_SECRECT }}"

      - name: setup
        uses: actions/checkout@v4
        with:
              node-version: 18.x

      - name: install
        run: npm install

      - name: build
        run: npm run build

      - name: deploy
        run: echo "Deploy"
      
      
      
      