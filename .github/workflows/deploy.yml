name: Deploy

on:
  push:
    branches: [main]

jobs:
  first_job:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Redis CLI
        run: sudo apt-get update -y && sudo apt-get install -y redis-tools

      - name: Test Redis
        run: redis-cli -h localhost -p 6379 ping

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        run: echo "Deploy"